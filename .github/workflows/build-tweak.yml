name: Build Tweak
on:
  workflow_dispatch:
    inputs:
      tweak:
        description: 'Tweak name'
        required: true
        default: 'HelloWorld'
jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Install Theos
        run: |
          export THEOS=$HOME/theos
          git clone --recursive https://github.com/theos/theos.git $THEOS
          curl -L https://github.com/theos/sdks/archive/master.tar.gz -o /tmp/sdks.tar.gz
          mkdir -p $THEOS/sdks && tar -xzf /tmp/sdks.tar.gz -C /tmp
          cp -r /tmp/sdks-master/iPhoneOS*.sdk $THEOS/sdks/ || true
      - name: Build
        run: |
          export THEOS=$HOME/theos
          export PATH=$THEOS/bin:$PATH
          cd Tweak/${{ github.event.inputs.tweak }}
          make package FINALPACKAGE=1 DEBUG=0
      - name: Collect
        run: |
          mkdir -p out
          find Tweak/${{ github.event.inputs.tweak }}/.theos -name '*.dylib' -exec cp {} out/ \;
      - uses: actions/upload-artifact@v4
        with:
          name: tweak-dylib
          path: out/*.dylib
